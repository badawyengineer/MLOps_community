name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests && black --check src tests
      - name: Tests (coverage gate in pyproject)
        run: pytest -q
      - name: Retrieval-quality gate
        # Fails the PR if hit@1 / MRR / abstention behaviour regress below data/eval/thresholds.json
        run: python -m prodml.evaluation --compare --retriever hybrid --k 1 --threshold 0.2 --check data/eval/thresholds.json --out reports/eval/latest.json
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: eval-report
          path: reports/eval/latest.json

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/Dockerfile -t legal-qa:ci .
      - name: Run container, check health, non-root user, and a real answer
        run: |
          docker run -d --name qa -p 8000:8000 legal-qa:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/health
          test "$(docker exec qa whoami)" = "appuser"
          curl -sf -X POST localhost:8000/ask -H 'Content-Type: application/json' \
            -d '{"question":"Must contracts be performed in good faith?"}' | tee /tmp/ask.json
          grep -q "Article 148" /tmp/ask.json
          curl -sf localhost:8000/metrics | grep -q prodml_requests_total
      - name: Image size (for the single- vs multi-stage comparison in the report)
        run: docker images legal-qa:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}'
