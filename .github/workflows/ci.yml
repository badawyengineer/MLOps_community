name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:            # "Run workflow" button, to re-run without a new commit

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,tracking,fixtures,pdf]"
      - name: Lint
        run: ruff check src tests && black --check src tests
      - name: Tests (coverage gate lives in pyproject)
        run: pytest -q
      - name: Retrieval-quality gate (hit@1 / MRR / abstention vs data/eval/thresholds.json)
        run: prodml-eval --compare --retriever hybrid-dense --k 1 --threshold 0.25 --check data/eval/thresholds.json --out reports/eval/latest.json
      - name: Faithfulness gate (offline proxy; fails the PR below 0.75)
        # This is the lexical PROXY, not RAGAS. Real RAGAS needs a judge-LLM key: run
        # `prodml-monitor --ragas --min-faithfulness 0.75` on a schedule with that secret instead.
        run: prodml-monitor --min-faithfulness 0.75 --out reports/monitoring/latest.json
      - name: Rebuild the vector index from the committed corpus
        run: |
          prodml-index
          test -s data/index/vectors.npz && test -s data/index/meta.json
      - name: End-to-end smoke test
        run: prodml-smoke
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: reports
          path: |
            reports/eval/latest.json
            reports/monitoring/latest.json

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image (bakes corpus + vector index)
        run: docker build -f docker/Dockerfile -t legal-qa:ci .
      - name: Index is really baked into the image
        run: docker run --rm legal-qa:ci ls -l /app/data/index/vectors.npz /app/data/index/meta.json
      - name: Run container, then smoke-test it over HTTP
        run: |
          docker run -d --name qa -p 8000:8000 legal-qa:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          test "$(docker exec qa whoami)" = "appuser"
          pip install -e .
          prodml-smoke --url http://localhost:8000
      - name: Image size (single- vs multi-stage comparison for the report)
        run: docker images legal-qa:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}'

  publish:
    # Pushes the image to Docker Hub on main / version tags. It needs two repository secrets
    # (Settings -> Secrets and variables -> Actions): DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
    # WITHOUT them every step below is skipped and the job still succeeds - a missing optional
    # secret must never turn the main branch red.
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    env:
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Skip notice
        if: env.DH_USER == '' || env.DH_TOKEN == ''
        run: echo "::notice::Docker Hub secrets are not set, so the image was not published. Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN to enable this job."
      - uses: actions/checkout@v4
        if: env.DH_USER != '' && env.DH_TOKEN != ''
      - uses: docker/login-action@v3
        if: env.DH_USER != '' && env.DH_TOKEN != ''
        with:
          username: ${{ env.DH_USER }}
          password: ${{ env.DH_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        if: env.DH_USER != '' && env.DH_TOKEN != ''
        with:
          images: ${{ env.DH_USER }}/legal-qa
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        if: env.DH_USER != '' && env.DH_TOKEN != ''
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
