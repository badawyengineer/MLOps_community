# Reproducible pipeline: `dvc repro` rebuilds only the stages whose inputs changed.
#
# The source PDF is DVC-tracked (data/raw/egyptian_civil_code.pdf.dvc is in Git, the PDF itself is
# not). To fetch it on a fresh clone you need a DVC remote with the file pushed to it:
#   dvc remote add -d storage <s3-or-gdrive-or-local-path> && dvc push      (once, by the owner)
#   git clone ... && dvc pull && dvc repro                                  (everyone else)
# Without a remote, put the PDF at data/raw/egyptian_civil_code.pdf yourself and run `dvc repro`.
# Inspect the extracted columns first with `python -m prodml.ingest --dump 3` (layouts differ).
stages:
  build_corpus:
    cmd: python -m prodml.ingest
    deps:
      - data/raw/egyptian_civil_code.pdf
      - src/prodml/corpus.py
      - src/prodml/ingest.py
    outs:
      - data/processed/articles.json:
          cache: false                      # small text file: keep it in Git too

  validate_corpus:
    cmd: python -m prodml.validate_corpus --strict
    deps:
      - src/prodml/validate_corpus.py
      - data/processed/articles.json
      - data/processed/known_issues.json

  build_index:
    cmd: python -m prodml.indexing
    deps:
      - src/prodml/indexing.py
      - src/prodml/retriever.py
      - src/prodml/chunking.py
      - src/prodml/embedders.py
      - src/prodml/vectorstore.py
      - data/processed/articles.json
    outs:
      - data/index                          # binary vectors: DVC-cached, not in Git

  evaluate:
    cmd: python -m prodml.evaluation --compare --sweep --retriever hybrid-dense --k 1 --threshold 0.3 --out reports/eval/latest.json --check data/eval/thresholds.json
    deps:
      - src/prodml/retriever.py
      - src/prodml/evaluation.py
      - src/prodml/corpus.py
      - data/processed/articles.json
      - data/eval/questions.json
      - data/eval/thresholds.json
    outs:
      - reports/eval/latest.json:
          cache: false
