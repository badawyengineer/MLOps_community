global:
  scrape_interval: 15s
rule_files:
  - alerts.yml
scrape_configs:
  - job_name: legal-qa
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: pushgateway          # eval-set quality pushed by `python -m prodml.monitor --push`
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
