# Core:           docker compose -f docker/docker-compose.yml up --build            (API on :8000)
# Observability:  docker compose -f docker/docker-compose.yml --profile observability up
#                 Prometheus :9090 | Pushgateway :9091 | Grafana :3001 (admin/admin)
# Canary:         docker compose -f docker/docker-compose.yml --profile canary up   (90/10 split on :8080)
# Test any of them with:  prodml-smoke --url http://localhost:8000
services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: prodml-legal-qa:latest
    ports:
      - "8000:8000"
    environment:
      PRODML_LOG_LEVEL: INFO
      PRODML_TOP_K: "3"
      # To use a real LLM (vLLM or any OpenAI-compatible API), uncomment:
      # PRODML_GENERATION_BACKEND: vllm
      # PRODML_LLM_BASE_URL: http://host.docker.internal:8001/v1
      # PRODML_LLM_MODEL: Qwen/Qwen2.5-1.5B-Instruct
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["observability"]
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on: [api, pushgateway]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ["observability"]
    ports: ["9093:9093"]
    volumes: ["./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]

  pushgateway:
    image: prom/pushgateway:v1.9.0
    profiles: ["observability"]
    ports: ["9091:9091"]

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["observability"]
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

  # --- canary: same image, tagged as a different model_version, behind a weighted nginx ---
  api-canary:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    profiles: ["canary"]
    environment:
      PRODML_MODEL_VERSION: canary
  router:
    image: nginx:1.27-alpine
    profiles: ["canary"]
    ports: ["8080:80"]
    volumes: ["./canary/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [api, api-canary]
