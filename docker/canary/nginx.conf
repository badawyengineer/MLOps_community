# Canary release: 90% of traffic to the stable API, 10% to the candidate.
# Watch the candidate with:  rate(prodml_abstentions_total[5m]) , prodml_faithfulness_proxy , p95 latency
# (the `model_version` field in every /ask response says which backend answered).
# Promote: raise the canary weight 10 -> 50 -> 100 while the dashboards stay healthy.
# Roll back: set the canary weight to 0 (or remove it) and `nginx -s reload`.
events {}
http {
  upstream legal_qa {
    server api:8000         weight=9;   # stable
    server api-canary:8000  weight=1;   # canary
  }
  server {
    listen 80;
    location / {
      proxy_pass http://legal_qa;
      proxy_http_version 1.1;
      proxy_buffering off;          # keep /ask/stream tokens flowing
    }
  }
}
