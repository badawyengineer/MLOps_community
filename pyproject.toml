[project]
name = "prodml"
version = "0.1.0"
description = "Arabic Legal Document Q&A — RAG service over the Egyptian Civil Code (ITI MLOps Practitioner final project, Track B)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "prometheus-client>=0.20",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "ruff>=0.4",
    "black>=24.0",
    "pre-commit>=3.7",
]
embeddings = [
    "sentence-transformers>=3.0",
]
ragas = [
    "ragas>=0.2",
    "datasets>=2.19",
]
tracking = [
    "mlflow>=2.12",
    "dvc>=3.50",
]
pdf = [
    "pdfplumber>=0.11",
]
fixtures = [
    "reportlab>=4.0",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.5",
]

[project.scripts]
prodml-build-corpus = "prodml.corpus:main"
prodml-eval = "prodml.evaluation:main"
prodml-smoke = "prodml.smoke:main"
prodml-index = "prodml.indexing:main"
prodml-reindex = "prodml.reindex:main"
prodml-ingest = "prodml.ingest:main"
prodml-monitor = "prodml.monitor:main"
prodml-experiments = "prodml.experiments:main"
prodml-compare-llms = "prodml.compare_llms:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=src/prodml --cov-report=term-missing --cov-fail-under=70"

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
target-version = ["py312"]
