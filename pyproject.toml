[project]
name = "prodml"
version = "0.1.0"
description = "Arabic Legal Document Q&A — RAG service over the Egyptian Civil Code (ITI MLOps Practitioner final project, Track B)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "scikit-learn>=1.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "ruff>=0.4",
    "black>=24.0",
    "pre-commit>=3.7",
]
pdf = [
    "pdfplumber>=0.11",
]

[project.scripts]
prodml-build-corpus = "prodml.corpus:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=src/prodml --cov-report=term-missing --cov-fail-under=70"

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
target-version = ["py312"]
