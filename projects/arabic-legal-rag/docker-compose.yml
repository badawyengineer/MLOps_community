services:
  api:
    build: .
    container_name: arabic-legal-rag-api
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "Arabic Legal Document Q&A"
      APP_VERSION: "0.1.0"
      ENVIRONMENT: "docker"
      LOG_LEVEL: "INFO"
      MODEL_VERSION: "session1-mock-v1"
      MAX_QUESTION_LENGTH: "2000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
